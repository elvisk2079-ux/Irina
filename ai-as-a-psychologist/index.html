<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI as a Psychologist? — тренажёр слов</title>
<style>
:root{
  --bg:#f6f3ec; --card:#fffdf8; --ink:#25302c; --muted:#6b7570;
  --sage:#5f8a72; --sage-d:#3f6b55; --sage-l:#e6efe7; --line:#e1ddd2;
  --blue:#4b6f9e; --blue-l:#e8eef7; --ok:#2f8a5b; --ok-l:#e3f4ea; --bad:#c2524f; --bad-l:#fbe7e5;
  --gold:#c99a3a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
h1,h2,.serif{font-family:Georgia,"Times New Roman",serif}
header.hero{background:linear-gradient(160deg,#e9f0e6 0%,#f6f3ec 70%);padding:28px 18px 18px;text-align:center;border-bottom:1px solid var(--line)}
.hero h1{font-size:30px;line-height:1.15;margin:6px 0 4px;color:#1f2f3f}
.hero .sub{color:var(--muted);font-size:15px}
.tag{display:inline-block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--sage-d);background:var(--sage-l);border-radius:99px;padding:4px 12px}
.sticky{position:sticky;top:0;z-index:20;background:rgba(246,243,236,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:8px 14px}
.sticky .row{max-width:720px;margin:auto;display:flex;align-items:center;gap:10px;font-size:14px}
.pbar{flex:1;height:8px;background:#e4e0d4;border-radius:9px;overflow:hidden}
.pbar>div{height:100%;width:0;background:linear-gradient(90deg,var(--sage),var(--gold));transition:width .3s}
.score{font-weight:700;white-space:nowrap}
.toc{max-width:720px;margin:14px auto 0;padding:0 14px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.toc::-webkit-scrollbar{display:none}
.toc a{flex:0 0 auto;font-size:13px;text-decoration:none;color:var(--sage-d);background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 12px}
main{max-width:720px;margin:auto;padding:14px 12px 80px}
section.ex{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 16px;margin:18px 0;box-shadow:0 6px 18px rgba(60,50,30,.05);scroll-margin-top:56px}
.ex h2{font-size:22px;margin:0 0 2px;color:#1f2f3f;display:flex;gap:10px;align-items:baseline}
.ex h2 .n{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--sage);color:#fff;font:700 15px/30px -apple-system,Arial,sans-serif;text-align:center;transform:translateY(-3px)}
.instr{color:var(--muted);font-size:15px;margin:2px 0 12px}
.exscore{font-size:13px;color:var(--sage-d);font-weight:600}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:10px 14px;touch-action:manipulation}
button:active{transform:scale(.98)}
button.pri{background:var(--sage);border-color:var(--sage);color:#fff;font-weight:600}
button.ghost{background:transparent}
button.sm{font-size:14px;padding:7px 11px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips button{font-size:13px;padding:6px 11px;border-radius:99px}
.chips button.on{background:var(--sage-d);color:#fff;border-color:var(--sage-d)}
/* flashcards */
.fc-wrap{perspective:1200px}
.fc{position:relative;height:340px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;border:2px solid #cfe0d2;overflow:auto}
.fc .front{background:linear-gradient(170deg,#fff 0%,#eef5ee 100%)}
.fc .back{background:linear-gradient(170deg,#fff 0%,#eef2f9 100%);border-color:#cdd9ec;transform:rotateY(180deg)}
.fc .en{font-family:Georgia,serif;font-size:30px;font-weight:700;color:#1f2f3f;line-height:1.2}
.fc .ipa{color:var(--blue);margin-top:8px;font-size:17px}
.fc .ru{font-size:24px;font-weight:650;color:#1f2f3f}
.fc .exen{margin-top:14px;font-style:italic;font-size:16px}
.fc .exru{color:var(--muted);font-size:14px;margin-top:4px}
.fc .note{margin-top:10px;font-size:13px;background:#fff6dd;border-radius:10px;padding:5px 10px;color:#7a5a10}
.fc .hint{position:absolute;bottom:10px;font-size:12px;color:#9aa39e}
.fc-nav{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}
.fc-nav .count{font-size:14px;color:var(--muted)}
.say{border:none;background:var(--blue-l);color:var(--blue);border-radius:99px;padding:6px 12px;font-size:15px}
.knowbar{display:flex;gap:8px;margin-top:10px}
.knowbar button{flex:1}
.k-yes{border-color:#bfe2cd;color:var(--ok)} .k-no{border-color:#f0c9c7;color:var(--bad)}
/* question list */
.q{border-top:1px dashed var(--line);padding:12px 0}
.q:first-of-type{border-top:none}
.q .qn{font-size:12px;color:#9aa39e}
.q .prompt{font-size:17px;margin:2px 0 8px}
.q .prompt b{font-family:Georgia,serif;font-size:19px}
.q .hint{font-size:13px;color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts.one{grid-template-columns:1fr}
.opts button{text-align:left;min-height:46px}
.opts button.ok,.tok.ok{background:var(--ok-l);border-color:var(--ok);color:#1e5e3d;font-weight:600}
.opts button.bad{background:var(--bad-l);border-color:var(--bad);color:#8a2d2a}
.opts button:disabled{cursor:default}
.gap{display:inline-block;min-width:70px;border-bottom:2px solid var(--sage);text-align:center;font-weight:700;color:var(--sage-d)}
.fb{font-size:14px;margin-top:6px;border-radius:10px;padding:7px 10px}
.fb.ok{background:var(--ok-l);color:#1e5e3d}.fb.bad{background:var(--bad-l);color:#8a2d2a}
input[type=text],textarea{width:100%;font:inherit;font-size:17px;padding:11px 12px;border:1px solid #cfcabd;border-radius:12px;background:#fff;color:var(--ink)}
textarea{min-height:76px;resize:vertical}
input.ok,textarea.ok{border-color:var(--ok);background:var(--ok-l)} input.bad,textarea.bad{border-color:var(--bad);background:var(--bad-l)}
.inrow{display:flex;gap:8px;align-items:center}
.inrow input{flex:1}
/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .col{display:flex;flex-direction:column;gap:8px}
.match button{min-height:54px;font-size:15px;line-height:1.25;text-align:center}
.match button.sel{border-color:var(--blue);background:var(--blue-l)}
.match button.done{background:var(--ok-l);border-color:var(--ok);color:#1e5e3d;opacity:.75}
.match button.wrong{background:var(--bad-l);border-color:var(--bad)}
/* word order */
.built{min-height:52px;border:2px dashed #cfcabd;border-radius:12px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pool{display:flex;flex-wrap:wrap;gap:6px}
.tok{padding:7px 11px;border-radius:10px;font-size:16px;background:#f3f6f2}
.built .tok{background:var(--blue-l);border-color:#cdd9ec}
.final{text-align:center}
.final .big{font-size:44px;font-family:Georgia,serif;color:var(--sage-d);font-weight:700}
footer{text-align:center;color:#9aa39e;font-size:12px;padding:20px}
@media (min-width:600px){.hero h1{font-size:38px}.fc{height:320px}}
@media (max-width:380px){.opts{grid-template-columns:1fr}}
</style>
</head>

const $=(s,r=document)=>r.querySelector(s);
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const k in attrs){if(k==='class')e.className=attrs[k];else if(k==='html')e.innerHTML=attrs[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k]);}kids.flat().forEach(c=>{if(c==null)return;e.append(c.nodeType?c:document.createTextNode(c))});return e;};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a;};
const sample=(a,n)=>shuffle(a).slice(0,n);
const CONTR=[[/\bdon't\b/g,"do not"],[/\bdoesn't\b/g,"does not"],[/\bdidn't\b/g,"did not"],[/\bcan't\b/g,"cannot"],[/\bcan not\b/g,"cannot"],[/\bwon't\b/g,"will not"],[/\bit's\b/g,"it is"],[/\bi'm\b/g,"i am"],[/\bshe's\b/g,"she is"],[/\bhe's\b/g,"he is"],[/\bisn't\b/g,"is not"],[/\baren't\b/g,"are not"],[/\bi've\b/g,"i have"],[/\bthey're\b/g,"they are"],[/\bwe're\b/g,"we are"],[/\byou're\b/g,"you are"]];
function norm(s){s=(s||"").toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:"«»()—–]/g," ").replace(/-/g," ").replace(/\s+/g," ").trim();CONTR.forEach(([r,t])=>s=s.replace(r,t));return s;}
const match=(input,answers)=>answers.some(a=>norm(a)===norm(input));

/* speech */
let VOICE=null;
function pickVoice(){const vs=speechSynthesis.getVoices();VOICE=vs.find(v=>/en-GB/i.test(v.lang)&&/female|Kate|Serena|Martha|Google UK English Female/i.test(v.name))||vs.find(v=>/en-GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(text,slow){if(!('speechSynthesis' in window)){alert('Озвучка не поддерживается в этом браузере');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/\s*\/\s*/g,", ").replace("+ -ing","doing"));u.lang=VOICE?VOICE.lang:'en-GB';if(VOICE)u.voice=VOICE;u.rate=slow?0.6:0.9;speechSynthesis.speak(u);}
const sayBtn=(text,label="🔊")=>el('button',{class:'say',type:'button',onclick:e=>{e.stopPropagation();say(text)}},label);

/* global score */
const SCORE={tasks:new Map()};
function regTask(key){if(!SCORE.tasks.has(key))SCORE.tasks.set(key,null);updScore();}
function unregPrefix(p){for(const k of [...SCORE.tasks.keys()])if(k.startsWith(p))SCORE.tasks.delete(k);updScore();}
function setTask(key,ok){if(SCORE.tasks.get(key)===null){SCORE.tasks.set(key,!!ok);updScore();}}
function updScore(){let tot=0,done=0,ok=0;SCORE.tasks.forEach(v=>{tot++;if(v!==null){done++;if(v)ok++;}});$('#pscore').textContent=ok+' / '+tot;$('#pfill').style.width=(tot?done/tot*100:0)+'%';document.querySelectorAll('[data-exscore]').forEach(s=>{const p=s.dataset.exscore;let t=0,o=0,d=0;SCORE.tasks.forEach((v,k)=>{if(k.startsWith(p+':')){t++;if(v!==null)d++;if(v)o++;}});s.textContent=t?`✔ ${o} из ${t}`+(d===t?' — готово!':''):'';});const f=$('#finalBox');if(f)renderFinal();}

/* section builder */
let N=0;const TOC=[];
function section(id,title,instr,builder,opts={}){N++;const sec=el('section',{class:'ex',id:id});const body=el('div');
  const h=el('h2',{},el('span',{class:'n'},String(N)),el('span',{},title));
  sec.append(h,el('div',{class:'instr',html:instr}),el('div',{class:'exscore','data-exscore':id}),body);
  const build=()=>{unregPrefix(id+':');body.innerHTML='';builder(body,id);};
  build();
  if(!opts.noRedo)sec.append(el('div',{class:'btns'},el('button',{class:'sm ghost',type:'button',onclick:build},'🔄 Новый набор / заново')));
  $('#main').append(sec);TOC.push([id,title]);}

/* multiple choice list */
function mcList(body,id,items){ // items: {prompt(html|node), options[], answer, after?}
  items.forEach((it,i)=>{const key=id+':'+i;regTask(key);
    const q=el('div',{class:'q'});q.append(el('div',{class:'qn'},(i+1)+'.'));
    const p=el('div',{class:'prompt'});if(typeof it.prompt==='string')p.innerHTML=it.prompt;else p.append(it.prompt);q.append(p);
    const opts=el('div',{class:'opts'+(it.one?' one':'')});const fb=el('div');
    shuffle(it.options).forEach(o=>{const b=el('button',{type:'button'},o);b.onclick=()=>{
      const right=o===it.answer;setTask(key,right);
      if(right){opts.querySelectorAll('button').forEach(x=>{x.disabled=true;if(x.textContent===it.answer)x.classList.add('ok');});if(it.after){fb.className='fb ok';fb.innerHTML=it.after;}if(it.onRight)it.onRight(p);}
      else{b.classList.add('bad');b.disabled=true;}
    };opts.append(b);});
    q.append(opts,fb);body.append(q);});
}
/* typing list */
function typeList(body,id,items){ // items: {prompt html, answers[], hint, model, audio?}
  items.forEach((it,i)=>{const key=id+':'+i;regTask(key);
    const q=el('div',{class:'q'});q.append(el('div',{class:'qn'},(i+1)+'.'));
    const p=el('div',{class:'prompt',html:it.prompt});if(it.audio){p.prepend(sayBtn(it.audio,'🔊 Слушать'),' ');p.append(' ',el('button',{class:'say',type:'button',onclick:()=>say(it.audio,true)},'🐢'));}
    q.append(p);
    const inp=el('input',{type:'text',autocapitalize:'off',autocomplete:'off',autocorrect:'off',spellcheck:'false',placeholder:'Напиши по-английски'});
    const fb=el('div');let tries=0;
    const check=()=>{if(!inp.value.trim())return;tries++;
      if(match(inp.value,it.answers)){inp.className='ok';inp.disabled=true;setTask(key,tries===1);fb.className='fb ok';fb.innerHTML='Верно! '+(it.model?'<b>'+it.model+'</b>':'');btn.disabled=true;if(it.say)say(it.say);}
      else{inp.className='bad';fb.className='fb bad';fb.textContent='Пока не так. Попробуй ещё или возьми подсказку.';}};
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
    const btn=el('button',{class:'pri',type:'button',onclick:check},'OK');
    let h=0;const hint=el('button',{class:'sm',type:'button',onclick:()=>{const a=it.answers[0];h=Math.min(a.length,h+2);fb.className='fb';fb.style.background='#fff6dd';fb.textContent='Подсказка: '+a.slice(0,h)+'…';}},'💡 Подсказка');
    const show=el('button',{class:'sm',type:'button',onclick:()=>{setTask(key,false);fb.className='fb bad';fb.innerHTML='Ответ: <b>'+(it.model||it.answers[0])+'</b> — перепиши его, чтобы запомнить.';}},'👀 Ответ');
    q.append(el('div',{class:'inrow'},inp,btn),el('div',{class:'btns'},hint,show),fb);body.append(q);});
}
const opt4=(w,field,pool=W)=>{const others=sample(pool.filter(x=>x.id!==w.id&&x[field]!==w[field]),3).map(x=>x[field]);return [w[field],...others];};

    fc.innerHTML='';
    const front=el('div',{class:'face front'},el('div',{class:'en'},w.en),el('div',{class:'ipa'},w.ipa),el('div',{style:'margin-top:12px;display:flex;gap:8px'},sayBtn(w.en),el('button',{class:'say',type:'button',onclick:e=>{e.stopPropagation();say(w.en,true)}},'🐢')),el('div',{class:'hint'},'нажми, чтобы перевернуть'));
    const back=el('div',{class:'face back'},el('div',{class:'ru'},w.ru),el('div',{class:'exen'},w.ex,' ',sayBtn(w.ex)),el('div',{class:'exru'},w.exRu),w.note?el('div',{class:'note'},'💡 '+w.note):null);

section('match','Соедини пары','Нажми на английскую фразу, потом на её перевод. Раунд из 6 пар.',(body,id)=>{
  const deck=shuffle(W);const rounds=[];for(let r=0;r<deck.length;r+=6)rounds.push(deck.slice(r,r+6));
  let ri=0;const box=el('div');const info=el('div',{class:'instr'});body.append(info,box);
  rounds.forEach((r,k)=>r.forEach(w=>regTask(id+':'+k+':'+w.id)));
  const play=()=>{box.innerHTML='';const round=rounds[ri];info.textContent='Раунд '+(ri+1)+' из '+rounds.length;
    let sel=null,left=round.length;const L=el('div',{class:'col'}),R=el('div',{class:'col'});
    const miss=new Set();
    shuffle(round).forEach(w=>{const b=el('button',{type:'button'},w.en);b.dataset.id=w.id;b.onclick=()=>{if(b.classList.contains('done'))return;L.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b;say(w.en);};L.append(b);});
    shuffle(round).forEach(w=>{const b=el('button',{type:'button'},w.ru);b.dataset.id=w.id;b.onclick=()=>{if(!sel||b.classList.contains('done'))return;
      if(sel.dataset.id===b.dataset.id){sel.classList.remove('sel');sel.classList.add('done');b.classList.add('done');setTask(id+':'+ri+':'+w.id,!miss.has(w.id));sel=null;left--;
        if(!left){box.append(el('div',{class:'btns'},ri<rounds.length-1?el('button',{class:'pri',type:'button',onclick:()=>{ri++;play();}},'Следующий раунд ▶'):el('div',{class:'fb ok'},'Все пары найдены! 🎉')));}}
      else{miss.add(Number(sel.dataset.id));b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),500);}};R.append(b);});
    box.append(el('div',{class:'match'},L,R));};
  play();
});

section('order','Собери предложение','Нажимай на слова по порядку. Нажми на слово в строке, чтобы убрать его.',(body,id)=>{
  sample(ORDER,8).forEach((s,i)=>{const key=id+':'+i;regTask(key);const words=s.replace(/[.!?]$/,'').split(' ');const end=s.slice(-1);
    const q=el('div',{class:'q'});q.append(el('div',{class:'qn'},(i+1)+'.'));
    const built=el('div',{class:'built'}),pool=el('div',{class:'pool'}),fb=el('div');let tries=0;
    const add=(b)=>{b.remove();built.append(b);b.onclick=()=>{b.remove();pool.append(b);b.onclick=()=>add(b);};};
    shuffle(words).forEach(w=>{const b=el('button',{class:'tok',type:'button'},w);b.onclick=()=>add(b);pool.append(b);});
    const chk=el('button',{class:'pri sm',type:'button',onclick:()=>{const got=[...built.children].map(b=>b.textContent).join(' ');if(!got)return;tries++;
      if(norm(got)===norm(s)){setTask(key,tries===1);fb.className='fb ok';fb.textContent='✔ '+s;built.querySelectorAll('button').forEach(b=>{b.classList.add('ok');b.onclick=null});chk.disabled=true;say(s);}
      else{fb.className='fb bad';fb.textContent='Порядок неверный — попробуй ещё.';}}},'Проверить');
    const show=el('button',{class:'sm',type:'button',onclick:()=>{setTask(key,false);fb.className='fb bad';fb.textContent='Ответ: '+s;}},'👀 Ответ');
    q.append(built,pool,el('div',{class:'btns'},chk,show),fb);body.append(q);});
});
